name: Checks

on:
  push:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the libraries
        run: npm ci
      - name: Check the code style
        run: npm run lint
      - name: Check the code format
        run: npm run format:check

  build:
    name: Build
    needs: style
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the libraries
        run: npm ci
      - name: Check that the generated API types match the saved API description
        run: |
          npm run api:types
          git diff --exit-code -- src/shared/api/generated
      - name: Build
        run: npm run build
